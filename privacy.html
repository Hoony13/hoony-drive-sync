<h1>개인정보처리방침</h1>
<p>Hoony Ubuntu Drive Sync는 소유자 본인의 개인 서버에서만 동작하는 개인용 도구입니다.</p>
<ul>
<li>Google Drive 데이터는 소유자 본인의 서버와 Google Drive 사이에서만 동기화됩니다.</li>
<li>어떤 데이터도 제3자에게 전송하거나 공유·판매하지 않습니다.</li>
<li>OAuth 토큰은 소유자의 서버에만 저장되며, 언제든 Google 계정 설정에서 권한을 철회할 수 있습니다.</li>
</ul>
